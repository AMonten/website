    <!-- Particles.js (versión fijada + SRI, en vez de "latest" sin verificar) -->

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#0277BD" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": true },
                "size": { "value": 3, "random": true },
                "move": { "enable": true, "speed": 1 }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" } }
            }
        });
    </script>

    <!-- Ticker de Acciones Animado -->
    <script>
        // La API key de Finnhub vive del lado del servidor (Netlify Function
        // en netlify/functions/quotes.js), nunca en este script.
        const tickers = ["AAPL", "MSFT", "GOOGL", "AMZN", "TSLA", "META", "NVDA", "BRK.A", "JPM", "V"];
        const tickerContent = document.querySelector(".ticker-content");

        // Inicializar el Ticker
        async function initializeTicker() {
            tickers.forEach(ticker => {
                const stockItem = document.createElement('div');
                stockItem.className = 'stock-item';
                stockItem.id = `stock-${ticker}`;
                stockItem.innerHTML = `${ticker}: Cargando...`;
                tickerContent.appendChild(stockItem);
            });

            // Iniciar animación después de la primera carga
            await new Promise(resolve => setTimeout(resolve, 100));
            tickerContent.style.animationPlayState = 'running';
        }

        // Actualizar datos cada 30s sin afectar la animación
        async function updateTickerData() {
            try {
                const response = await fetch(`/.netlify/functions/quotes?symbols=${tickers.join(",")}`);
                const data = await response.json();

                tickers.forEach(ticker => {
                    const el = document.getElementById(`stock-${ticker}`);
                    const quote = data[ticker];
                    if (!el) return;
                    if (!quote || quote.error || quote.c == null) {
                        el.innerHTML = `${ticker}: N/D`;
                        return;
                    }

                    const change = ((quote.c - quote.pc) / quote.pc * 100).toFixed(2);
                    const changeElement = change >= 0 ?
                        `<span class="change up">▲${Math.abs(change)}%</span>` :
                        `<span class="change down">▼${Math.abs(change)}%</span>`;

                    el.innerHTML = `${ticker}: $${quote.c.toFixed(2)} ${changeElement}`;
                });
            } catch (error) {
                console.error("Error actualizando el ticker:", error);
            }
        }

        initializeTicker();
        setInterval(updateTickerData, 30000);
    </script>
